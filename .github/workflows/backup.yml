# Nightly backup and restore drill (pack prompt 27). Production is only READ (pg_dump). The dump is restored into a
# throwaway PostgreSQL on this runner and verified there (verify_restore + byte-for-byte Quran check), so every
# night proves the backup can actually be restored. With the BACKUP_PASSPHRASE secret set, the dump is also kept,
# encrypted (AES-256, gpg), as a 30-day artifact. The runner and its copy are discarded at the end.
name: Backup and restore drill

on:
  schedule:
    - cron: '41 2 * * *'   # 02:41 UTC = 04:41/05:41 Cairo, a quiet hour
  workflow_dispatch:

concurrency: { group: backup, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -q -r backend/requirements.txt

      - name: Dump production (read-only)
        env: { PROD_DATABASE_URL: '${{ secrets.PROD_DATABASE_URL }}' }
        run: |
          test -n "$PROD_DATABASE_URL" || { echo "::error title=Backup::PROD_DATABASE_URL secret is missing"; exit 1; }
          # pg_dump needs a session: use Neon's direct endpoint, not the transaction pooler.
          URL="${PROD_DATABASE_URL/-pooler./.}"
          echo "::add-mask::$URL"
          MAJOR=$(docker run --rm --network host postgres:17 psql "$URL" -tAc 'show server_version_num' | cut -c1-2) \
            || { echo "::error title=Backup::cannot connect to the production database"; exit 1; }
          echo "PG_MAJOR=$MAJOR" >> "$GITHUB_ENV"
          t0=$(date +%s)
          docker run --rm --network host -v "$PWD:/w" "postgres:$MAJOR" pg_dump --format=custom --no-owner --no-acl -f /w/halqa.dump "$URL" \
            || { echo "::error title=Backup::pg_dump failed"; exit 1; }
          echo "DUMP_SECONDS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          echo "DUMP_BYTES=$(stat -c %s halqa.dump)" >> "$GITHUB_ENV"
          echo "DUMP_SHA256=$(sha256sum halqa.dump | cut -c1-64)" >> "$GITHUB_ENV"

      - name: Restore into an isolated database on this runner
        run: |
          docker run -d --name restore --network host -e POSTGRES_PASSWORD=drill-only "postgres:$PG_MAJOR" -p 5433 >/dev/null
          for i in $(seq 1 30); do docker exec restore pg_isready -p 5433 -h 127.0.0.1 >/dev/null 2>&1 && break; sleep 1; done
          docker exec restore psql -p 5433 -U postgres -c 'create database halqa_restore' >/dev/null
          t0=$(date +%s)
          # Provider-specific statements (e.g. Neon extensions/roles) may be skipped with a warning; the verification
          # step below decides whether the copy is usable.
          docker run --rm --network host -v "$PWD:/w" "postgres:$PG_MAJOR" pg_restore --no-owner --no-acl \
            -d postgres://postgres:drill-only@127.0.0.1:5433/halqa_restore /w/halqa.dump 2> restore.err || true
          echo "RESTORE_SECONDS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          echo "RESTORE_WARNINGS=$(grep -c 'error:' restore.err || true)" >> "$GITHUB_ENV"
          grep 'error:' restore.err | head -5 | sed 's/^/::warning title=pg_restore::/' || true

      - name: Verify the restored copy
        working-directory: backend
        env:
          APP_ENV: staging          # not production: verify_restore refuses production
          DATABASE_URL: postgres://postgres:drill-only@127.0.0.1:5433/halqa_restore
          DJANGO_ALLOWED_HOSTS: testserver
          SECURE_SSL_REDIRECT: 'false'
          MEDIA_STORAGE: none
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')"
          t0=$(date +%s)
          python manage.py createcachetable   # no-op when the dump already has it (production does)
          rc=0; python manage.py verify_restore > ../verify.json 2> ../verify.err || rc=$?
          # Byte-for-byte Quran check against the Tanzil file the production import used.
          curl -sSL -A "halqa-backup (+https://github.com/ahmedmotaleb/Quran-app)" -o /tmp/quran.txt \
            "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=false&tatweel=true&quranType=uthmani&outType=txt-2&agree=true"
          qrc=0; python manage.py import_quran /tmp/quran.txt --verify > ../quran.txt 2>&1 || qrc=$?
          echo "VERIFY_SECONDS=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          cat ../verify.json; tail -2 ../quran.txt
          [ $rc = 0 ] || { echo "::error title=Restore drill::$(tr -d '\n' < ../verify.json | head -c 800) $(tail -1 ../verify.err)"; exit 1; }
          [ $qrc = 0 ] || { echo "::error title=Restore drill::Quran text differs from the source: $(tail -1 ../quran.txt)"; exit 1; }

      - name: Keep the encrypted backup
        env: { BACKUP_PASSPHRASE: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "STORED=no (set the BACKUP_PASSPHRASE secret to keep encrypted copies)" >> "$GITHUB_ENV"; exit 0
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "halqa-$(date -u +%Y%m%d-%H%M).dump.gpg" halqa.dump <<<"$BACKUP_PASSPHRASE"
          echo "STORED=yes (encrypted artifact, 30 days)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: env.STORED == 'yes (encrypted artifact, 30 days)'
        with: { name: 'halqa-db-backup-${{ github.run_id }}', path: '*.dump.gpg', retention-days: 30, if-no-files-found: error }

      - name: Report
        if: always()
        run: |
          rm -f halqa.dump   # the plain copy never leaves this runner
          {
            echo "## Backup and restore drill"
            echo "| step | result |"; echo "| --- | --- |"
            echo "| dump (PostgreSQL ${PG_MAJOR:-?}) | ${DUMP_BYTES:-?} bytes in ${DUMP_SECONDS:-?} s, sha256 ${DUMP_SHA256:0:16}… |"
            echo "| restore into isolated database | ${RESTORE_SECONDS:-?} s, ${RESTORE_WARNINGS:-?} skipped statements |"
            echo "| verification (sign-in, links, feedback, Quran) | ${VERIFY_SECONDS:-?} s |"
            echo "| stored | ${STORED:-no} |"
            echo; echo '```json'; cat verify.json 2>/dev/null; echo '```'
            tail -2 quran.txt 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"
          ok=$(python3 -c "import json;print(json.load(open('verify.json'))['ok'])" 2>/dev/null || echo False)
          echo "::notice title=Backup drill::dump ${DUMP_BYTES:-?} B in ${DUMP_SECONDS:-?}s; restore ${RESTORE_SECONDS:-?}s; verify ${VERIFY_SECONDS:-?}s; checks ok=$ok; stored=${STORED:-no}"
          python3 -c "import json;d=json.load(open('verify.json'));print('::notice title=Restore checks::'+'; '.join(f'{k}={v}' for k,v in d['checks'].items()))" 2>/dev/null || true
          python3 -c "import json;d=json.load(open('verify.json'));print('::notice title=Restored counts::'+'; '.join(f'{k}={v}' for k,v in d['counts'].items()))" 2>/dev/null || true
