# Builds the one image (PWA + API), applies database migrations, and deploys it to Google Cloud Run.
# Runs on every push to main and by hand. Needs the one-time setup in docs/DEPLOY.md (deploy/gcp-setup.sh):
#   repository variables GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA and the secret PROD_DATABASE_URL.
# Until the variables exist the job is skipped, so merges keep working before hosting is set up.
# Staging (PROMPT 47, deploy/gcp-staging.sh): when the variable STAGING_ENABLED is 1 the same image is first deployed
# to the staging services with the staging database and secrets, migrated and smoke-tested; production deploys only
# after that passes. Manual promotion = required reviewers on the GitHub "production" environment.
name: Deploy (Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  REGION: europe-west1
  SERVICE: halqa

jobs:
  staging:
    if: vars.GCP_PROJECT_ID != '' && vars.STAGING_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      STAGE: halqa-staging
    steps:
      - uses: actions/checkout@v4

      - name: Work out the staging addresses
        env:
          HAS_DB: ${{ secrets.STAGING_DATABASE_URL != '' }}
        run: |
          PNUM=$(echo "${{ vars.GCP_WIF_PROVIDER }}" | cut -d/ -f2)
          echo "STAGE_URL=https://$STAGE-$PNUM.$REGION.run.app" >> "$GITHUB_ENV"
          echo "STAGE_ADMIN_URL=https://$STAGE-admin-$PNUM.$REGION.run.app" >> "$GITHUB_ENV"
          echo "IMAGE=$REGION-docker.pkg.dev/$PROJECT/$SERVICE/$SERVICE:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          test "$HAS_DB" = "true" || { echo "::error::Add the repository secret STAGING_DATABASE_URL (deploy/gcp-staging.sh)."; exit 1; }

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image (production reuses it)
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Apply database migrations (staging database)
        env:
          APP_ENV: staging
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DJANGO_ALLOWED_HOSTS: ops.invalid
          MEDIA_STORAGE: none
        run: |
          # Explain a bad secret without ever printing it: only the shape, host suffix and database name.
          python3 - <<'PY'
          import os, sys, urllib.parse as u
          raw = os.environ["DATABASE_URL"]; v = raw.strip()
          def err(m): print(f"::error title=STAGING_DATABASE_URL::{m}"); sys.exit(1)
          if v != raw: print("::warning title=STAGING_DATABASE_URL::has spaces or a line break at the start/end (ignored here, but fix the secret)")
          if v.startswith("psql"): err("starts with 'psql' - paste only the postgresql://... part, without psql and quotes")
          if v[:1] in "'\"": err("is wrapped in quotes - remove them")
          p = u.urlparse(v)
          if p.scheme not in ("postgres", "postgresql"): err(f"must start with postgresql:// (got scheme '{p.scheme[:12]}')")
          if not p.hostname or not p.password: err("has no host or no password - copy the full connection string from Neon")
          db = p.path.lstrip("/")
          print(f"::notice title=Staging database::host ...{p.hostname[-24:]} database '{db}'")
          if db != "halqa_staging": print(f"::warning title=STAGING_DATABASE_URL::database is '{db}', expected halqa_staging")
          PY
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n' | sed 's/^ *//; s/ *$//')"
          set +e
          docker run --rm -e APP_ENV -e DATABASE_URL -e DJANGO_ALLOWED_HOSTS -e MEDIA_STORAGE \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')" \
            "$IMAGE" sh -c 'python manage.py migrate --noinput && python manage.py createcachetable' > migrate.log 2>&1
          rc=$?; set -e
          # Hide anything that looks like a connection string or password before showing the error.
          sed -E 's#postgres(ql)?://[^ ]*#postgresql://***#g; s/password[^ ]*/password=***/Ig' migrate.log | tail -25
          if [ $rc -ne 0 ]; then
            echo "::error title=Staging migrations::$(sed -E 's#postgres(ql)?://[^ ]*#postgresql://***#g; s/password[^ ]*/password=***/Ig' migrate.log | grep -v '^\s*$' | tail -4 | tr '\n' ' ' | cut -c1-600)"
            exit $rc
          fi

      - name: Deploy the staging services (own runtime account and secrets; no email or push)
        env:
          STORAGE_ENV: ${{ vars.STAGING_STORAGE_ENV }}
        run: |
          python3 - <<'PY'
          import json, os
          base = {"APP_ENV": "staging", "SKIP_MIGRATE": "1", "APP_URL": os.environ["STAGE_URL"], "ADMIN_URL": os.environ["STAGE_ADMIN_URL"]}
          for pair in filter(None, os.environ.get("STORAGE_ENV", "").split(",")):
              k, v = pair.split("=", 1)
              assert k.startswith("STORAGE_"), k
              base[k] = v
          json.dump(base, open("/tmp/stage-env.yaml", "w"))
          host = os.environ["STAGE_ADMIN_URL"].split("//", 1)[1]
          json.dump({**base, "PORTAL": "admin", "DJANGO_ALLOWED_HOSTS": host, "CSRF_TRUSTED_ORIGINS": os.environ["STAGE_ADMIN_URL"]},
                    open("/tmp/stage-admin-env.yaml", "w"))
          PY
          SECRETS="DATABASE_URL=$STAGE-database-url:latest,DJANGO_SECRET_KEY=$STAGE-secret-key:latest"
          test -z "$STORAGE_ENV" || SECRETS="$SECRETS,STORAGE_SECRET_ACCESS_KEY=$STAGE-storage-secret:latest"
          for svc in "$STAGE" "$STAGE-admin"; do
            f=/tmp/stage-env.yaml; test "$svc" = "$STAGE" || f=/tmp/stage-admin-env.yaml
            gcloud run deploy "$svc" --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
              --service-account "$STAGE-run@$PROJECT.iam.gserviceaccount.com" \
              --allow-unauthenticated --port 8080 --memory 512Mi --cpu 1 --cpu-boost \
              --min-instances 0 --max-instances 2 --concurrency 40 --timeout 120 \
              --env-vars-file "$f" --set-secrets "$SECRETS" --quiet
          done

      - name: Check staging (ready, admin portal, smoke test)
        run: |
          for i in $(seq 1 30); do curl -fs --max-time 20 "$STAGE_URL/api/ready" | grep -q '"status":"ok"' && break; sleep 5; done
          curl -fs "$STAGE_URL/api/ready" | grep -q '"status":"ok"' || { echo "::error::$STAGE_URL/api/ready: $(curl -s $STAGE_URL/api/ready)"; exit 1; }
          curl -fs "$STAGE_ADMIN_URL/admin/" | grep -q '/admin/manifest.webmanifest' || { echo "::error::staging admin portal not served"; exit 1; }
          npm i --no-save playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          mkdir -p shots && node e2e/smoke.mjs shots "$STAGE_URL/"
          echo "::notice title=Staging::$STAGE_URL/ · $STAGE_ADMIN_URL/admin/"

  deploy:
    needs: staging
    # Production waits for staging when staging is enabled; without it (skipped) production deploys as before.
    if: ${{ !cancelled() && vars.GCP_PROJECT_ID != '' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write   # keyless login to Google Cloud (Workload Identity Federation)
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the app address
        env:
          HAS_DB: ${{ secrets.PROD_DATABASE_URL != '' }}
        run: |
          # The provider name contains the project number: projects/<number>/locations/global/...
          PNUM=$(echo "${{ vars.GCP_WIF_PROVIDER }}" | cut -d/ -f2)
          echo "$PNUM" | grep -qE '^[0-9]+$' || { echo "::error::GCP_WIF_PROVIDER does not look like projects/<number>/locations/global/workloadIdentityPools/..."; exit 1; }
          echo "APP_URL=https://$SERVICE-$PNUM.$REGION.run.app" >> "$GITHUB_ENV"
          echo "ADMIN_URL=https://$SERVICE-admin-$PNUM.$REGION.run.app" >> "$GITHUB_ENV"   # the admin portal's own address
          echo "IMAGE=$REGION-docker.pkg.dev/$PROJECT/$SERVICE/$SERVICE:${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          test "$HAS_DB" = "true" || { echo "::error::Add the repository secret PROD_DATABASE_URL (the Neon connection string)."; exit 1; }

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image (unless staging already did)
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          if gcloud artifacts docker images describe "$IMAGE" --project "$PROJECT" >/dev/null 2>&1; then echo "reusing the staged image $IMAGE"; exit 0; fi
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Apply database migrations
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DJANGO_ALLOWED_HOSTS: ops.invalid
          MEDIA_STORAGE: none
        run: |
          docker run --rm -e APP_ENV -e DATABASE_URL -e DJANGO_ALLOWED_HOSTS -e MEDIA_STORAGE \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')" \
            "$IMAGE" sh -c 'python manage.py migrate --noinput && python manage.py createcachetable'

      - name: Deploy to Cloud Run
        run: |
          # Free-tier friendly: scales to zero, at most 2 instances, 512 MB, CPU only while serving requests.
          # STORAGE_* / EMAIL_* are added later with "gcloud run services update" (docs/DEPLOY.md); --update-env-vars keeps them.
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "$SERVICE-run@$PROJECT.iam.gserviceaccount.com" \
            --allow-unauthenticated --port 8080 --memory 512Mi --cpu 1 --cpu-boost \
            --min-instances 0 --max-instances 2 --concurrency 40 --timeout 120 \
            --update-env-vars "APP_ENV=production,SKIP_MIGRATE=1,APP_URL=$APP_URL,ADMIN_URL=$ADMIN_URL" \
            --update-secrets "DATABASE_URL=$SERVICE-database-url:latest,DJANGO_SECRET_KEY=$SERVICE-secret-key:latest" \
            --quiet
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          echo "Cloud Run reports: $URL   (app address: $APP_URL)"

      - name: Deploy the hourly maintenance job (same image, same settings and secrets)
        run: |
          # Copy the service's current env vars and secret references (including STORAGE_* / EMAIL_* added later).
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format json > /tmp/svc.json
          # Plain values go through an env-vars file (JSON is valid YAML), so values containing @ , = or spaces (email
          # addresses, a sender display name) need no escaping. Secret references are name=secret:version pairs.
          python3 - <<'PY'
          import json
          env = json.load(open("/tmp/svc.json"))["spec"]["template"]["spec"]["containers"][0].get("env", [])
          plain = {e["name"]: e["value"] for e in env if "value" in e and e["name"] != "PORT"}
          secret = [f'{e["name"]}={e["valueFrom"]["secretKeyRef"]["name"]}:{e["valueFrom"]["secretKeyRef"]["key"]}' for e in env if "valueFrom" in e]
          json.dump(plain, open("/tmp/job-env.yaml", "w"), ensure_ascii=False)
          open("/tmp/job-secrets", "w").write(",".join(secret))
          PY
          gcloud run jobs deploy "$SERVICE-tasks" --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "$SERVICE-run@$PROJECT.iam.gserviceaccount.com" \
            --command python --args manage.py,run_scheduled --memory 512Mi --cpu 1 --max-retries 0 --task-timeout 600 \
            --env-vars-file /tmp/job-env.yaml --set-secrets "$(cat /tmp/job-secrets)" --quiet

      - name: Deploy the admin portal service (same image, settings and secrets; its own address)
        run: |
          # A separate origin, so phones install «إدارة الحلقة» as its own app: Chrome on Android will not install a
          # second app inside the learners' app's scope. PORTAL=admin serves only the portal; invitation and setup links
          # still use APP_URL (the learners' app).
          python3 - <<'PY'
          import json, os
          env = json.load(open("/tmp/job-env.yaml"))
          host = os.environ["ADMIN_URL"].split("//", 1)[1]
          env.update({"PORTAL": "admin", "ADMIN_URL": os.environ["ADMIN_URL"], "DJANGO_ALLOWED_HOSTS": host,
                      "CSRF_TRUSTED_ORIGINS": os.environ["ADMIN_URL"], "SKIP_MIGRATE": "1"})
          json.dump(env, open("/tmp/admin-env.yaml", "w"), ensure_ascii=False)
          PY
          gcloud run deploy "$SERVICE-admin" --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --service-account "$SERVICE-run@$PROJECT.iam.gserviceaccount.com" \
            --allow-unauthenticated --port 8080 --memory 512Mi --cpu 1 --cpu-boost \
            --min-instances 0 --max-instances 1 --concurrency 40 --timeout 120 \
            --env-vars-file /tmp/admin-env.yaml --set-secrets "$(cat /tmp/job-secrets)" --quiet
          for i in $(seq 1 30); do curl -fs --max-time 20 "$ADMIN_URL/api/ready" | grep -q '"status":"ok"' && break; sleep 5; done
          curl -fs "$ADMIN_URL/admin/" | grep -q '/admin/manifest.webmanifest' || { echo "::error::$ADMIN_URL/admin/ does not serve the admin portal"; exit 1; }
          echo "::notice title=Admin portal::$ADMIN_URL/admin/"

      - name: Check the live app
        run: |
          for i in $(seq 1 30); do
            body=$(curl -s --max-time 20 "$APP_URL/api/ready" || true)
            echo "$body" | grep -q '"status":"ok"' && { echo "ready: $body"; break; }
            sleep 5
          done
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::$APP_URL/api/ready is not ok: $body"; exit 1; }
          curl -fs "$APP_URL/" | grep -q 'manifest'
          echo "::notice title=Deployed::$APP_URL"
