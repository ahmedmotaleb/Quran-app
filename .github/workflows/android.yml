# Android app (android/, a Trusted Web Activity over the HALQA site). Owner request, 14 Nov 2026.
# - Pull requests touching android/: debug build plus Android lint, and the built APK's real targetSdk and
#   permissions are printed (aapt2), so the configuration is verified rather than assumed.
# - "Run workflow" (release): a SIGNED release APK and AAB from the owner's keystore (secrets HALQA_KEYSTORE_BASE64,
#   HALQA_KEYSTORE_PASSWORD, HALQA_KEY_ALIAS, HALQA_KEY_PASSWORD; created by deploy/android-keystore.sh). Without them
#   the run stops: an unsigned or debug-signed build is never published as a release. The signature is checked with
#   apksigner and its SHA-256 fingerprint printed (for ANDROID_CERT_SHA256 / assetlinks.json).
name: Android (TWA)

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'package.json']
  workflow_dispatch:
    inputs:
      release:
        description: Build the signed release APK + AAB (needs the HALQA_KEYSTORE_* secrets)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HALQA_APP_HOST: ${{ vars.HALQA_APP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "BT=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"
      - name: Gradle properties
        run: |
          echo "halqa.versionCode=${{ github.run_number }}" >> android/gradle.properties
          if [ -n "$HALQA_APP_HOST" ]; then echo "halqa.host=$HALQA_APP_HOST" >> android/gradle.properties; fi

      - name: Debug build and lint
        if: github.event_name == 'pull_request' || !inputs.release
        run: |
          cd android && gradle --no-daemon assembleDebug lintDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)" | tee /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt || { echo "::error::targetSdk is not 36"; exit 1; }
          echo "::notice title=Android debug APK::$(tr '\n' ' ' < /tmp/badging.txt)"

      - name: Signed release (APK + AAB)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          KS_B64: ${{ secrets.HALQA_KEYSTORE_BASE64 }}
          HALQA_KEYSTORE_PASSWORD: ${{ secrets.HALQA_KEYSTORE_PASSWORD }}
          HALQA_KEY_ALIAS: ${{ secrets.HALQA_KEY_ALIAS }}
          HALQA_KEY_PASSWORD: ${{ secrets.HALQA_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$HALQA_KEYSTORE_PASSWORD" ] || [ -z "$HALQA_KEY_ALIAS" ]; then
            echo "::error title=No signing key::Add the HALQA_KEYSTORE_* secrets (deploy/android-keystore.sh explains). Nothing was published."; exit 1
          fi
          export HALQA_KEYSTORE_FILE="$RUNNER_TEMP/halqa.jks"
          printf '%s' "$KS_B64" | base64 -d > "$HALQA_KEYSTORE_FILE"
          cd android && gradle --no-daemon assembleRelease bundleRelease lintRelease
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/sig.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/sig.txt || { echo "::error::APK not v2-signed"; exit 1; }
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)" | tee /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt || { echo "::error::targetSdk is not 36"; exit 1; }
          FP=$(grep -m1 "certificate SHA-256 digest" /tmp/sig.txt | awk '{print $NF}' | sed 's/../&:/g;s/:$//' | tr a-f A-F)
          echo "::notice title=Signing certificate SHA-256 (public; set ANDROID_CERT_SHA256 to this)::$FP"
          echo "::notice title=Android release APK::$(tr '\n' ' ' < /tmp/badging.txt)"
          rm -f "$HALQA_KEYSTORE_FILE"
          mkdir -p /tmp/out && cp "$APK" /tmp/out/halqa-${{ github.run_number }}.apk && cp app/build/outputs/bundle/release/app-release.aab /tmp/out/halqa-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release
        with:
          name: halqa-android-${{ github.run_number }}
          path: /tmp/out/
          retention-days: 30
