# One-off production tasks, run by hand from the Actions tab (the database is reached from GitHub; Cloud Run has no shell).
# Needs the repository secret PROD_DATABASE_URL (the Neon connection string).
name: Ops (production database)

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [import-quran, verify-quran, create-admin, promote-admin, smoke-test, alert-drill, recent-errors]
      admin_email:
        description: create-admin / promote-admin — the admin's email (create-admin takes the password from the ADMIN_PASSWORD secret; promote-admin keeps the account's password)
        required: false
      url:
        description: smoke-test only — the app address, e.g. https://halqa-<number>.europe-west1.run.app/
        required: false
      accept_tanzil_terms:
        description: import/verify only — I accept the Tanzil Quran Text license (verbatim text, attribution, link to tanzil.net)
        type: boolean
        default: false

jobs:
  # Monitoring drill (pack prompt 26): the production maintenance job logs one synthetic event per monitored
  # failure path; this checks they reached Cloud Logging. The owner should then get the alert emails.
  # Needs deploy/gcp-ops.sh to have run (alert policies + read-only log access for the deploy account).
  # Recent production errors (last 6 hours), without request bodies or personal data: event, status and detail only.
  errors:
    if: inputs.task == 'recent-errors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read recent error events
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          gcloud logging read 'severity>=ERROR AND resource.type="cloud_run_revision" AND timestamp>="'$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)'"' \
            --project "$P" --limit 30 --format json > /tmp/err.json
          python3 - <<'PY'
          import json
          rows = json.load(open("/tmp/err.json"))
          print(f"{len(rows)} error events in the last 6 hours")
          for r in rows[:30]:
              j = r.get("jsonPayload") or {}
              keep = {k: j[k] for k in ("msg", "env", "path", "status", "error", "detail", "step", "event") if k in j}
              line = f"{r.get('timestamp','')[:19]} {json.dumps(keep, ensure_ascii=False)[:400]}"
              print(line)
              print(f"::notice title=error::{line}")
          PY

  drill:
    if: inputs.task == 'alert-drill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Emit synthetic failures from production and find them in the logs
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gcloud run jobs execute halqa-tasks --project "$P" --region europe-west1 --args manage.py,emit_test_alert --wait --quiet
          for i in $(seq 1 12); do
            n=$(gcloud logging read "jsonPayload.synthetic=true AND timestamp>=\"$START\"" --project "$P" --format 'value(jsonPayload.msg)' 2>/tmp/err | sort -u | tr '\n' ' ')
            [ "$(wc -w <<<"$n")" -ge 6 ] && break; sleep 20
          done
          if [ -s /tmp/err ] && grep -q PERMISSION_DENIED /tmp/err; then
            echo "::error title=Alert drill::The deploy account cannot read logs yet. Run deploy/gcp-ops.sh in Cloud Shell first."; exit 1
          fi
          echo "::notice title=Alert drill::events in Cloud Logging: ${n:-none}"
          [ "$(wc -w <<<"$n")" -ge 6 ] || { echo "::error title=Alert drill::expected 6 synthetic events"; exit 1; }
          # Monitoring REST API (the gcloud "alpha" component is not installed on GitHub runners).
          API="https://monitoring.googleapis.com/v3/projects/$P"; H="Authorization: Bearer $(gcloud auth print-access-token)"
          curl -fsS -H "$H" "$API/alertPolicies?pageSize=200" -o /tmp/pol.json || { echo "::error title=Alert drill::cannot list alert policies (monitoring.viewer missing? run deploy/gcp-ops.sh)"; exit 1; }
          curl -fsS -H "$H" "$API/notificationChannels?pageSize=50" -o /tmp/ch.json || echo '{}' > /tmp/ch.json
          python3 - <<'PY'
          import json
          pol = [p for p in json.load(open("/tmp/pol.json")).get("alertPolicies", []) if p["displayName"].startswith("Halqa:")]
          ch = {c["name"]: c for c in json.load(open("/tmp/ch.json")).get("notificationChannels", [])}
          used = {n for p in pol for n in p.get("notificationChannels", [])}
          to = sorted({ch[n]["labels"].get("email_address", "?") for n in used if n in ch})
          off = [p["displayName"] for p in pol if not p.get("enabled", True)]
          print(f"::notice title=Alert drill::{len(pol)} Halqa alert policies; emails go to: {', '.join(to) or 'NO CHANNEL'}"
                + (f"; disabled: {', '.join(off)}" if off else "")
                + ". Expect 'Halqa: operational failure' and 'Halqa: sign-in abuse' within ~10 minutes (check spam).")
          if not pol or not to:
              print("::error title=Alert drill::no Halqa alert policies or no email channel: run deploy/gcp-ops.sh in Cloud Shell")
              raise SystemExit(1)
          PY

  run:
    if: inputs.task != 'alert-drill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # shell: bash adds pipefail, so a failing command piped into tee still fails the step.
    defaults: { run: { working-directory: backend, shell: bash } }
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DJANGO_ALLOWED_HOSTS: ops.invalid
      MEDIA_STORAGE: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.task != 'smoke-test'
        with: { python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt }
      - if: inputs.task != 'smoke-test'
        run: pip install -r requirements.txt 2>&1 | tee /tmp/ops-1-pip.log
      - name: Throwaway signing key (management commands only)
        if: inputs.task != 'smoke-test'
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - if: inputs.task != 'smoke-test'
        run: python manage.py migrate --noinput 2>&1 | tee /tmp/ops-2-migrate.log

      - name: Download the Tanzil Uthmani text (verbatim)
        if: inputs.task == 'import-quran' || inputs.task == 'verify-quran'
        run: |
          exec > >(tee /tmp/ops-3-download.log) 2>&1
          test "${{ inputs.accept_tanzil_terms }}" = "true" || { echo "Tick 'accept_tanzil_terms' to download the text."; exit 1; }
          get() {  # url, file: retries, and names the HTTP status on failure
            for i in 1 2 3; do
              code=$(curl -sSL --retry 2 -A "halqa-import (+https://github.com/ahmedmotaleb/Quran-app)" -o "$2" -w '%{http_code}' "$1") && [ "$code" = 200 ] && return 0
              echo "download $2: HTTP ${code:-none} (try $i)"; sleep 5
            done; return 1
          }
          get "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=false&tatweel=true&quranType=uthmani&outType=txt-2&agree=true" quran-uthmani.txt
          get "https://tanzil.net/res/text/metadata/quran-data.xml" quran-data.xml
          sha256sum quran-uthmani.txt quran-data.xml
          wc -l quran-uthmani.txt; head -c 300 quran-uthmani.txt; echo
          grep -m1 -i "version" quran-uthmani.txt || true
      - name: Import (rejected unless every surah has the Hafs ayah count)
        if: inputs.task == 'import-quran'
        run: |
          VERSION=$(grep -m1 -oiE 'version:? *[0-9.]+' quran-uthmani.txt | grep -oE '[0-9.]+' || echo unknown)
          python manage.py import_quran quran-uthmani.txt --metadata quran-data.xml --source-version "$VERSION" --activate 2>&1 | tee /tmp/ops-4-import.log
      - name: Verify the stored text byte-for-byte
        if: inputs.task == 'import-quran' || inputs.task == 'verify-quran'
        run: |
          python manage.py import_quran quran-uthmani.txt --verify 2>&1 | tee /tmp/ops-5-verify.log
          echo "::notice title=quran::$(tail -2 /tmp/ops-5-verify.log | tr '\n' ' ')"

      - name: Create the first admin
        if: inputs.task == 'create-admin'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python manage.py create_admin --email "${{ inputs.admin_email }}" 2>&1 | tee /tmp/ops-6-admin.log
          echo "::notice title=admin::$(tail -1 /tmp/ops-6-admin.log)"

      - name: Promote an existing account to admin
        if: inputs.task == 'promote-admin'
        run: |
          python manage.py promote_admin --email "${{ inputs.admin_email }}" 2>&1 | tee /tmp/ops-7-promote.log
          echo "::notice title=admin::$(tail -1 /tmp/ops-7-promote.log)"

      # Job logs are not always readable where this is operated from, so failures are also reported as annotations.
      - name: Report the failure
        if: failure() && inputs.task != 'smoke-test'
        run: |
          f=$(ls -t /tmp/ops-*.log 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "::error title=$(basename "$f" .log)::$(tail -8 "$f" | tr '\n' ' ' | cut -c1-900)"; else echo "::error::Failed before any task step (setup)."; fi

      # Post-deploy check from GitHub's network: server ready, PWA installable, sign-up, Mushaf.
      # Creates one throwaway student (smoke+<time>@example.com) per run.
      - uses: actions/setup-node@v4
        if: inputs.task == 'smoke-test'
        with: { node-version: 22 }
      - name: Smoke test the deployed app
        if: inputs.task == 'smoke-test'
        working-directory: .
        run: |
          test -n "${{ inputs.url }}" || { echo "Give the app address in 'url'."; exit 1; }
          # Raw probe first (status, timing, first bytes) so network problems are distinguishable from app problems.
          for path in api/health api/ready; do
            out=$(curl -sS -m 150 -o body.txt -w '%{http_code} %{time_total}s' "${{ inputs.url }}$path" 2>&1 || true)
            echo "::notice title=probe::$path -> $out :: $(head -c 300 body.txt 2>/dev/null | tr '\n' ' ')"
          done
          npm i --no-save playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          mkdir -p shots && node e2e/smoke.mjs shots "${{ inputs.url }}"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.task == 'smoke-test'
        with: { name: smoke-shots, path: shots, if-no-files-found: ignore }
