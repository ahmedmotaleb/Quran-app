# One-off production tasks, run by hand from the Actions tab (the database is reached from GitHub; Cloud Run has no shell).
# Needs the repository secret PROD_DATABASE_URL (the Neon connection string).
name: Ops (production database)

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [import-quran, verify-quran, create-admin, promote-admin, smoke-test, alert-drill, recent-errors, audio-check, upload-trace, client-diagnostics, account-integrity, trusted-devices, migrate-teacher-invitations]
      admin_email:
        description: create-admin / promote-admin — the admin's email (create-admin takes the password from the ADMIN_PASSWORD secret; promote-admin keeps the account's password)
        required: false
      url:
        description: smoke-test only — the app address, e.g. https://halqa-<number>.europe-west1.run.app/
        required: false
      hours:
        description: upload-trace / client-diagnostics / account-integrity — how many hours back to look (default 72)
        required: false
      apply:
        description: migrate-teacher-invitations only — create the accounts and send the setup emails (unticked = dry run)
        type: boolean
        default: false
      accept_tanzil_terms:
        description: import/verify only — I accept the Tanzil Quran Text license (verbatim text, attribution, link to tanzil.net)
        type: boolean
        default: false

jobs:
  # Monitoring drill (pack prompt 26): the production maintenance job logs one synthetic event per monitored
  # failure path; this checks they reached Cloud Logging. The owner should then get the alert emails.
  # Needs deploy/gcp-ops.sh to have run (alert policies + read-only log access for the deploy account).
  # Recent production errors (last 6 hours), without request bodies or personal data: event, status and detail only.
  # Licensed recitation source: run check_quran_audio inside production (the maintenance job has the service's
  # settings and secrets), then show its log line and any Quran Foundation error.
  audio:
    if: inputs.task == 'audio-check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Fetch Al-Fatihah's ayah audio list from Quran Foundation, inside production
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gcloud run jobs execute halqa-tasks --project "$P" --region europe-west1 --args manage.py,check_quran_audio --wait --quiet || echo "check failed"
          sleep 20
          gcloud logging read 'jsonPayload.msg=("qf_audio_check" OR "qf_token_failed" OR "qf_request_failed" OR "qf_audio_hosts_dropped") AND timestamp>="'$START'"' \
            --project "$P" --limit 10 --format json > /tmp/a.json
          python3 - <<'PY'
          import json
          rows = json.load(open("/tmp/a.json"))
          if not rows:
              print("::warning title=audio-check::no log lines yet")
          for r in rows:
              j = r.get("jsonPayload") or {}
              keep = {k: j[k] for k in ("msg", "result", "env", "surah", "recitation", "ayahs", "hosts", "path", "status", "error", "detail") if k in j}
              print(f"::notice title=audio-check::{json.dumps(keep, ensure_ascii=False)[:500]}")
          checks = [r.get("jsonPayload") or {} for r in rows if (r.get("jsonPayload") or {}).get("msg") == "qf_audio_check"]
          # Every offered reciter must have audio.
          raise SystemExit(0 if checks and all(c.get("result") == "ok" for c in checks) else 1)
          PY

  errors:
    if: inputs.task == 'recent-errors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read recent error events
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          gcloud logging read 'severity>=ERROR AND resource.type="cloud_run_revision" AND timestamp>="'$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)'"' \
            --project "$P" --limit 30 --format json > /tmp/err.json
          python3 - <<'PY'
          import json
          rows = json.load(open("/tmp/err.json"))
          print(f"{len(rows)} error events in the last 6 hours")
          for r in rows[:30]:
              j = r.get("jsonPayload") or {}
              keep = {k: j[k] for k in ("msg", "env", "path", "status", "error", "detail", "step", "event") if k in j}
              line = f"{r.get('timestamp','')[:19]} {json.dumps(keep, ensure_ascii=False)[:400]}"
              print(line)
              print(f"::notice title=error::{line}")
          PY

  # Read-only check after the profile-update fix (22–23 Oct): accounts whose role, status or two-step verification has
  # no matching audit event (ids and reasons only), counts of existing phones, and the profile updates (`PATCH me`)
  # Cloud Run served in the last N hours (status and size only; bodies are never logged).
  integrity:
    if: inputs.task == 'account-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run account_integrity inside production and read its lines
        env:
          HOURS: ${{ inputs.hours || '72' }}
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SINCE=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          gcloud run jobs execute halqa-tasks --project "$P" --region europe-west1 --args manage.py,account_integrity --wait --quiet || echo "::warning::check failed"
          sleep 20
          gcloud logging read 'jsonPayload.msg=("account_integrity_flag" OR "account_integrity_summary") AND timestamp>="'$START'"' \
            --project "$P" --limit 300 --format json > /tmp/i.json || true
          # Only PATCH me (the profile endpoint the fix covers); PUT me/onboarding never accepted these fields.
          gcloud logging read 'resource.type="cloud_run_revision" AND httpRequest.requestMethod="PATCH" AND httpRequest.requestUrl:"/api/v1/me" AND -httpRequest.requestUrl:"/api/v1/me/" AND timestamp>="'$SINCE'"' \
            --project "$P" --limit 300 --format json > /tmp/me.json || true
          python3 - <<'PY'
          import json, re
          rows = json.load(open("/tmp/i.json"))
          if not rows:
              print("::warning title=integrity::no log lines yet")
          for r in rows:
              j = r.get("jsonPayload") or {}
              keep = {k: j[k] for k in ("msg", "user", "role", "status", "joined", "last_login", "flags", "accounts", "flagged", "phones",
                                        "phones_valid", "phones_invalid", "phone_numbers_shared_by_several_accounts", "verified_phones") if k in j}
              print(f"::notice title=integrity::{json.dumps(keep, ensure_ascii=False)[:500]}")
          me = json.load(open("/tmp/me.json"))
          print(f"::notice title=profile-updates::{len(me)} PATCH me requests in the window")
          for r in me[:300]:
              h = r.get("httpRequest", {})
              path = re.sub(r"\?.*", "", h.get("requestUrl", "")).split("/api/v1/")[-1]
              print(f"::notice title=me::{r.get('timestamp','')[:19]} {h.get('requestMethod')} {path} {h.get('status')} req={h.get('requestSize','?')}B")
          PY

  # «تذكّر هذا الجهاز» evidence: per admin (ids only) devices created/active/matching and how often trust skipped
  # the code, plus the admin sign-in requests Cloud Run served (host, status, browser family; no cookies or bodies).
  trusted:
    if: inputs.task == 'trusted-devices'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run trusted_devices_report inside production; read admin sign-in requests
        env:
          HOURS: ${{ inputs.hours || '72' }}
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SINCE=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          gcloud run jobs execute halqa-tasks --project "$P" --region europe-west1 --args manage.py,trusted_devices_report --wait --quiet || echo "::warning::report failed"
          sleep 20
          gcloud logging read 'jsonPayload.msg="trusted_devices_report" AND timestamp>="'$START'"' --project "$P" --limit 50 --format json > /tmp/t.json || true
          gcloud logging read 'resource.type="cloud_run_revision" AND httpRequest.requestUrl:"/api/v1/admin/auth/login" AND timestamp>="'$SINCE'"' \
            --project "$P" --limit 40 --format json > /tmp/l.json || true
          python3 - <<'PY'
          import json, re
          for r in json.load(open("/tmp/t.json")):
              j = dict(r.get("jsonPayload") or {})
              for k in ("msg", "ts", "level", "severity", "logger", "request_id"):
                  j.pop(k, None)
              print(f"::notice title=admin::{json.dumps(j, ensure_ascii=False)[:900]}")
          def fam(ua):
              os_ = next((n for k, n in (("Android", "Android"), ("iPhone", "iPhone"), ("Windows", "Windows"), ("Mac OS", "Mac"), ("Linux", "Linux")) if k in ua), "?")
              br = next((n for k, n in (("SamsungBrowser", "Samsung"), ("Edg", "Edge"), ("Firefox", "Firefox"), ("CriOS", "Chrome-iOS"), ("Chrome/", "Chrome"), ("Safari", "Safari")) if k in ua), "?")
              return f"{br} {os_}{' webview' if '; wv)' in ua else ''}"
          rows = json.load(open("/tmp/l.json"))
          lines = []
          for r in rows:
              h = r.get("httpRequest", {})
              host = re.sub(r"^https?://([^/]+).*", r"\1", h.get("requestUrl", ""))
              lines.append(f"{r.get('timestamp','')[:19]} {h.get('status')} {host.split('.')[0]} req={h.get('requestSize','?')}B resp={h.get('responseSize','?')}B {fam(h.get('userAgent',''))}")
          print(f"::notice title=logins::{len(rows)} admin sign-in requests :: " + " | ".join(lines[:40]))
          PY

  # Open teacher invitations from the previous flow → teacher accounts + setup email (dry run unless «apply»).
  teacher-invitations:
    if: inputs.task == 'migrate-teacher-invitations'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run migrate_teacher_invitations inside production
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ARGS="manage.py,migrate_teacher_invitations"
          [ "${{ inputs.apply }}" = "true" ] && ARGS="$ARGS,--apply"
          gcloud run jobs execute halqa-tasks --project "$P" --region europe-west1 --args "$ARGS" --wait --quiet || echo "::warning::migration failed"
          sleep 20
          gcloud logging read 'jsonPayload.msg=("teacher_invitation_migration" OR "teacher_invitation_migration_summary") AND timestamp>="'$START'"' \
            --project "$P" --limit 100 --format json > /tmp/m.json || true
          python3 - <<'PY'
          import json
          rows = json.load(open("/tmp/m.json"))
          lines = []
          for r in rows:
              j = dict(r.get("jsonPayload") or {})
              for k in ("ts", "level", "severity", "logger", "request_id"):
                  j.pop(k, None)
              lines.append(json.dumps(j, ensure_ascii=False)[:300])
          print("::notice title=teacher-invitations::" + (" | ".join(lines) if lines else "no log lines yet"))
          PY

  # Media uploads (recitations, voice notes) in the last N hours: what Cloud Run answered (status, size, latency,
  # response type, request id, browser/OS family) and the app's own warning/error lines for those requests. No
  # cookies, no bodies, no full user agent, no URLs with tokens.
  client-diagnostics:
    # Recording notes sent by phones (src/services/diag.ts): step, error name, supported formats, device family.
    if: inputs.task == 'client-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read recording diagnostics
        env:
          HOURS: ${{ inputs.hours || '72' }}
        run: |
          SINCE=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          gcloud logging read 'resource.type="cloud_run_revision" AND jsonPayload.msg="client_diagnostic" AND timestamp>="'$SINCE'"' \
            --project "${{ vars.GCP_PROJECT_ID }}" --limit 200 --format json > /tmp/diag.json
          python3 - <<'PY'
          import json
          rows = json.load(open("/tmp/diag.json"))
          print(f"::notice title=count::{len(rows)} recording notes")
          for r in reversed(rows):
              p = r.get("jsonPayload", {})
              line = (f"{r.get('timestamp','')[:19]} {p.get('event')} [{p.get('device')}{' app' if p.get('standalone') else ' browser'}] "
                      f"user={p.get('user')} step={p.get('step')} status={p.get('status')} code={p.get('err_code')} err={p.get('error')} "
                      f"mime={p.get('mime')} secs={p.get('secs')} kb={p.get('size_kb')} online={p.get('online')} supports={','.join(p.get('supported') or [])}")
              print(line); print(f"::notice title=diag::{line[:900]}")
          PY

  upload-trace:
    if: inputs.task == 'upload-trace'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read upload requests and related app log lines
        env:
          HOURS: ${{ inputs.hours || '72' }}
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          SINCE=$(date -u -d "$HOURS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          gcloud logging read 'resource.type="cloud_run_revision" AND httpRequest.requestMethod="POST" AND (httpRequest.requestUrl:"media" OR httpRequest.requestUrl:"submissions") AND timestamp>="'$SINCE'"' \
            --project "$P" --limit 200 --format json > /tmp/req.json || echo "::warning::request log read failed"
          gcloud logging read 'resource.type="cloud_run_revision" AND httpRequest.requestMethod="POST" AND timestamp>="'$SINCE'"' \
            --project "$P" --limit 5 --format json > /tmp/any.json || true
          gcloud logging read 'resource.type="cloud_run_revision" AND severity>=WARNING AND (jsonPayload.msg:"media" OR jsonPayload.path:"/api/v1/media/" OR textPayload:"/api/v1/media/" OR jsonPayload.request:"/api/v1/media/") AND timestamp>="'$SINCE'"' \
            --project "$P" --limit 100 --format json > /tmp/app.json || echo "::warning::app log read failed"
          python3 - <<'PY'
          import json, re
          def family(ua):
              os_ = next((n for k, n in (("Android", "Android"), ("iPhone", "iPhone"), ("iPad", "iPad"), ("Windows", "Windows"), ("Mac OS", "Mac"), ("Linux", "Linux")) if k in ua), "?")
              br = next((n for k, n in (("SamsungBrowser", "Samsung"), ("EdgA", "Edge"), ("Edg/", "Edge"), ("Firefox", "Firefox"), ("CriOS", "Chrome-iOS"), ("Chrome/", "Chrome"), ("Safari", "Safari")) if k in ua), "?")
              v = re.search(r"(?:Chrome|CriOS|Version)/(\d+)", ua)
              wv = " webview" if "; wv)" in ua else ""
              return f"{br}{'/' + v.group(1) if v else ''} {os_}{wv}"
          reqs = json.load(open("/tmp/req.json"))
          anyp = json.load(open("/tmp/any.json"))
          print(f"::notice title=counts::{len(reqs)} media upload requests; sample POST urls: {[re.sub(r'[?].*', '', (a.get('httpRequest') or {}).get('requestUrl', ''))[-60:] for a in anyp]}")
          for r in reqs:
              h = r.get("httpRequest", {})
              path = re.sub(r"\?.*", "", h.get("requestUrl", "")).split("/api/v1/")[-1]
              line = (f"{r.get('timestamp','')[:19]} {h.get('status')} {path} req={h.get('requestSize','?')}B resp={h.get('responseSize','?')}B "
                      f"lat={h.get('latency','?')} {family(h.get('userAgent',''))} trace={str(r.get('trace','')).split('/')[-1][:12]}")
              print(line); print(f"::notice title=upload::{line}")
          app = json.load(open("/tmp/app.json"))
          print(f"::notice title=counts::{len(app)} related app log lines")
          for r in app:
              j = r.get("jsonPayload") or {}
              keep = {k: j[k] for k in ("msg", "status_code", "status", "error", "purpose", "bytes", "request_id", "detail", "code") if k in j}
              line = f"{r.get('timestamp','')[:19]} {r.get('severity')} {json.dumps(keep, ensure_ascii=False)[:300] if keep else (r.get('textPayload') or '')[:300]}"
              print(line); print(f"::notice title=app::{line}")
          PY

  drill:
    if: inputs.task == 'alert-drill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Emit synthetic failures from production and find them in the logs
        run: |
          P="${{ vars.GCP_PROJECT_ID }}"
          START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gcloud run jobs execute halqa-tasks --project "$P" --region europe-west1 --args manage.py,emit_test_alert --wait --quiet
          for i in $(seq 1 12); do
            n=$(gcloud logging read "jsonPayload.synthetic=true AND timestamp>=\"$START\"" --project "$P" --format 'value(jsonPayload.msg)' 2>/tmp/err | sort -u | tr '\n' ' ')
            [ "$(wc -w <<<"$n")" -ge 6 ] && break; sleep 20
          done
          if [ -s /tmp/err ] && grep -q PERMISSION_DENIED /tmp/err; then
            echo "::error title=Alert drill::The deploy account cannot read logs yet. Run deploy/gcp-ops.sh in Cloud Shell first."; exit 1
          fi
          echo "::notice title=Alert drill::events in Cloud Logging: ${n:-none}"
          [ "$(wc -w <<<"$n")" -ge 6 ] || { echo "::error title=Alert drill::expected 6 synthetic events"; exit 1; }
          # Monitoring REST API (the gcloud "alpha" component is not installed on GitHub runners).
          API="https://monitoring.googleapis.com/v3/projects/$P"; H="Authorization: Bearer $(gcloud auth print-access-token)"
          curl -fsS -H "$H" "$API/alertPolicies?pageSize=200" -o /tmp/pol.json || { echo "::error title=Alert drill::cannot list alert policies (monitoring.viewer missing? run deploy/gcp-ops.sh)"; exit 1; }
          curl -fsS -H "$H" "$API/notificationChannels?pageSize=50" -o /tmp/ch.json || echo '{}' > /tmp/ch.json
          python3 - <<'PY'
          import json
          pol = [p for p in json.load(open("/tmp/pol.json")).get("alertPolicies", []) if p["displayName"].startswith("Halqa:")]
          ch = {c["name"]: c for c in json.load(open("/tmp/ch.json")).get("notificationChannels", [])}
          used = {n for p in pol for n in p.get("notificationChannels", [])}
          to = sorted({ch[n]["labels"].get("email_address", "?") for n in used if n in ch})
          off = [p["displayName"] for p in pol if not p.get("enabled", True)]
          print(f"::notice title=Alert drill::{len(pol)} Halqa alert policies; emails go to: {', '.join(to) or 'NO CHANNEL'}"
                + (f"; disabled: {', '.join(off)}" if off else "")
                + ". Expect 'Halqa: operational failure' and 'Halqa: sign-in abuse' within ~10 minutes (check spam).")
          if not pol or not to:
              print("::error title=Alert drill::no Halqa alert policies or no email channel: run deploy/gcp-ops.sh in Cloud Shell")
              raise SystemExit(1)
          PY

  run:
    if: inputs.task != 'alert-drill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # shell: bash adds pipefail, so a failing command piped into tee still fails the step.
    defaults: { run: { working-directory: backend, shell: bash } }
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DJANGO_ALLOWED_HOSTS: ops.invalid
      MEDIA_STORAGE: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.task != 'smoke-test'
        with: { python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt }
      - if: inputs.task != 'smoke-test'
        run: pip install -r requirements.txt 2>&1 | tee /tmp/ops-1-pip.log
      - name: Throwaway signing key (management commands only)
        if: inputs.task != 'smoke-test'
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - if: inputs.task != 'smoke-test'
        run: python manage.py migrate --noinput 2>&1 | tee /tmp/ops-2-migrate.log

      - name: Download the Tanzil Uthmani text (verbatim)
        if: inputs.task == 'import-quran' || inputs.task == 'verify-quran'
        run: |
          exec > >(tee /tmp/ops-3-download.log) 2>&1
          test "${{ inputs.accept_tanzil_terms }}" = "true" || { echo "Tick 'accept_tanzil_terms' to download the text."; exit 1; }
          get() {  # url, file: retries, and names the HTTP status on failure
            for i in 1 2 3; do
              code=$(curl -sSL --retry 2 -A "halqa-import (+https://github.com/ahmedmotaleb/Quran-app)" -o "$2" -w '%{http_code}' "$1") && [ "$code" = 200 ] && return 0
              echo "download $2: HTTP ${code:-none} (try $i)"; sleep 5
            done; return 1
          }
          get "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=false&tatweel=true&quranType=uthmani&outType=txt-2&agree=true" quran-uthmani.txt
          get "https://tanzil.net/res/text/metadata/quran-data.xml" quran-data.xml
          sha256sum quran-uthmani.txt quran-data.xml
          wc -l quran-uthmani.txt; head -c 300 quran-uthmani.txt; echo
          grep -m1 -i "version" quran-uthmani.txt || true
      - name: Import (rejected unless every surah has the Hafs ayah count)
        if: inputs.task == 'import-quran'
        run: |
          VERSION=$(grep -m1 -oiE 'version:? *[0-9.]+' quran-uthmani.txt | grep -oE '[0-9.]+' || echo unknown)
          python manage.py import_quran quran-uthmani.txt --metadata quran-data.xml --source-version "$VERSION" --activate 2>&1 | tee /tmp/ops-4-import.log
      - name: Verify the stored text byte-for-byte
        if: inputs.task == 'import-quran' || inputs.task == 'verify-quran'
        run: |
          python manage.py import_quran quran-uthmani.txt --verify 2>&1 | tee /tmp/ops-5-verify.log
          echo "::notice title=quran::$(tail -2 /tmp/ops-5-verify.log | tr '\n' ' ')"

      - name: Create the first admin
        if: inputs.task == 'create-admin'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python manage.py create_admin --email "${{ inputs.admin_email }}" 2>&1 | tee /tmp/ops-6-admin.log
          echo "::notice title=admin::$(tail -1 /tmp/ops-6-admin.log)"

      - name: Promote an existing account to admin
        if: inputs.task == 'promote-admin'
        run: |
          python manage.py promote_admin --email "${{ inputs.admin_email }}" 2>&1 | tee /tmp/ops-7-promote.log
          echo "::notice title=admin::$(tail -1 /tmp/ops-7-promote.log)"

      # Job logs are not always readable where this is operated from, so failures are also reported as annotations.
      - name: Report the failure
        if: failure() && inputs.task != 'smoke-test'
        run: |
          f=$(ls -t /tmp/ops-*.log 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "::error title=$(basename "$f" .log)::$(tail -8 "$f" | tr '\n' ' ' | cut -c1-900)"; else echo "::error::Failed before any task step (setup)."; fi

      # Post-deploy check from GitHub's network: server ready, PWA installable, sign-up, Mushaf.
      # Creates one throwaway student (smoke+<time>@example.com) per run.
      - uses: actions/setup-node@v4
        if: inputs.task == 'smoke-test'
        with: { node-version: 22 }
      - name: Smoke test the deployed app
        if: inputs.task == 'smoke-test'
        working-directory: .
        run: |
          test -n "${{ inputs.url }}" || { echo "Give the app address in 'url'."; exit 1; }
          # Raw probe first (status, timing, first bytes) so network problems are distinguishable from app problems.
          for path in api/health api/ready; do
            out=$(curl -sS -m 150 -o body.txt -w '%{http_code} %{time_total}s' "${{ inputs.url }}$path" 2>&1 || true)
            echo "::notice title=probe::$path -> $out :: $(head -c 300 body.txt 2>/dev/null | tr '\n' ' ')"
          done
          npm i --no-save playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          mkdir -p shots && node e2e/smoke.mjs shots "${{ inputs.url }}"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.task == 'smoke-test'
        with: { name: smoke-shots, path: shots, if-no-files-found: ignore }
