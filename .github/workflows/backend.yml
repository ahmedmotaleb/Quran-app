name: Backend

on:
  push:
    branches: [main, halqa-frontend]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: halqa
          POSTGRES_PASSWORD: halqa-ci-only
          POSTGRES_DB: halqa_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U halqa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgres://halqa:halqa-ci-only@localhost:5432/halqa_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Known vulnerabilities in production dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate a clean database
        run: python manage.py migrate --noinput
      - name: Tests (PostgreSQL, incl. concurrency)
        run: pytest -p no:warnings --create-db
      - name: Production settings refuse unsafe config
        run: |
          if APP_ENV=production DJANGO_SECRET_KEY=short python manage.py check 2>/dev/null; then
            echo "::error::production started with an unsafe secret key"; exit 1; fi
          APP_ENV=production DJANGO_ALLOWED_HOSTS=api.example.com \
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
          python manage.py check --deploy --fail-level WARNING
