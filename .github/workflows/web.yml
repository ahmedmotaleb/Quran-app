name: Web (PWA)

on:
  push:
    branches: [main, halqa-frontend]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Build (demo mode)
        run: npm run build
      - name: Check the PWA output
        run: |
          test -f dist/sw.js && test -f dist/manifest.webmanifest
          grep -q 'push-sw.js' dist/sw.js && test -f dist/push-sw.js   # Web Push handlers are loaded by the service worker
          node -e "const m=JSON.parse(require('fs').readFileSync('dist/manifest.webmanifest','utf8'));for(const k of ['name','short_name','start_url','display','icons']) if(!m[k]) throw new Error('manifest missing '+k);if(m.display!=='standalone'||m.dir!=='rtl') throw new Error('display/dir')"
          # Duplicate precache entries make Workbox abort installation (offline would silently break).
          dups=$(grep -o 'url:"[^"]*"' dist/sw.js | sort | uniq -d | wc -l); test "$dups" = 0
          # API responses must never be cached by the service worker.
          if grep -o 'urlPattern:[^,]*' dist/sw.js | grep -q '/api/'; then echo "service worker caches /api"; exit 1; fi
          # The admin portal is a separate installable app: its own page with exactly one manifest (id/scope /admin/).
          grep -q 'href="/admin/manifest.webmanifest"' dist/admin/index.html && ! grep -q 'href="/manifest.webmanifest"' dist/admin/index.html
          node -e "const m=JSON.parse(require('fs').readFileSync('dist/admin/manifest.webmanifest','utf8'));if(m.id!=='/admin/'||m.scope!=='/admin/'||m.start_url!=='/admin/') throw new Error('admin manifest scope')"
      - uses: actions/upload-artifact@v4
        with:
          name: halqa-pwa-${{ github.sha }}
          path: dist
          retention-days: 14

  docker:
    # The same image the Cloud Run deploy builds: PWA + API in one container.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: halqa, POSTGRES_PASSWORD: halqa-ci-only, POSTGRES_DB: halqa_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U halqa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t halqa:ci .
      - name: Boot in production mode against an empty database
        run: |
          docker run -d --name halqa --network host -e PORT=8090 -e APP_ENV=production \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')" \
            -e DATABASE_URL=postgres://halqa:halqa-ci-only@127.0.0.1:5432/halqa_ci \
            -e APP_URL=http://localhost -e SECURE_SSL_REDIRECT=false halqa:ci
          for i in $(seq 1 60); do curl -fs localhost:8090/api/ready && break; sleep 2; done
          curl -fs localhost:8090/api/ready | grep -q '"status":"ok"'
          curl -fs localhost:8090/ | grep -q 'manifest'
          curl -fsI localhost:8090/sw.js | grep -qi 'cache-control: no-cache'
          curl -fs localhost:8090/some/deep/link | grep -q '<div id="root">'
          curl -fs localhost:8090/admin/ | grep -q '/admin/manifest.webmanifest'          # the admin app's own page
          curl -fs localhost:8090/admin/manifest.webmanifest | grep -q '"scope": "/admin/"'
          # Security headers on pages, static files and the API (Content-Security-Policy, HSTS-ready, no framing).
          for u in / /sw.js /api/health; do curl -fsI localhost:8090$u | grep -qi "content-security-policy: default-src 'self'" || { echo "no CSP on $u"; exit 1; }; done
          curl -fsI localhost:8090/ | grep -qi 'x-frame-options: deny'
      - if: failure()
        run: docker logs halqa
