# Load test (pack prompt 25) in an isolated, throwaway environment — never against production.
# The production image runs with Cloud Run's limits (1 CPU, 512 MB, 2 workers x 4 threads) against a fresh
# PostgreSQL 16 (pg_stat_statements on) and MinIO (S3 API, like R2). Dataset: `seed_load` (500 students, 10
# teachers, 250 parents) plus the verified Quran text. Results: job summary + artifact.
name: Load test

on:
  workflow_dispatch:
    inputs:
      hold:
        description: 'How long to hold each step (25 then 50 active students), e.g. 3m'
        default: '3m'

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PGURL: postgres://halqa:halqa-load-only@127.0.0.1:5432/halqa_load
      LOAD_PASSWORD: load-test-only-1
    steps:
      - uses: actions/checkout@v4

      - name: Database and object storage
        run: |
          docker run -d --name pg --network host -e POSTGRES_USER=halqa -e POSTGRES_PASSWORD=halqa-load-only -e POSTGRES_DB=halqa_load \
            postgres:16 -c shared_preload_libraries=pg_stat_statements -c log_min_duration_statement=200 -c max_connections=100
          docker run -d --name minio --network host -e MINIO_ROOT_USER=loadtest -e MINIO_ROOT_PASSWORD=loadtest-secret \
            minio/minio:RELEASE.2024-10-13T13-34-11Z server /data --address :9000
          for i in $(seq 1 30); do docker exec pg pg_isready -U halqa && break; sleep 2; done
          docker exec pg psql -U halqa -d halqa_load -c 'create extension pg_stat_statements'
          for i in $(seq 1 30); do curl -fs localhost:9000/minio/health/live && break; sleep 2; done
          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2024-10-08T09-37-26Z -c \
            'mc alias set l http://localhost:9000 loadtest loadtest-secret && mc mb l/halqa-load'

      - name: Build the production image
        run: docker build -t halqa:load .

      - name: Start the app with Cloud Run's limits
        run: |
          # Auth/upload rate limits are per address; every virtual user comes from this one runner, so they are raised.
          docker run -d --name app --network host --cpus 1 --memory 512m --memory-swap 512m \
            -e PORT=8090 -e APP_ENV=staging -e SKIP_MIGRATE=1 -e WEB_CONCURRENCY=2 \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(64))')" \
            -e DATABASE_URL="$PGURL" -e APP_URL=http://localhost:8090 -e SECURE_SSL_REDIRECT=false \
            -e STORAGE_ENDPOINT_URL=http://localhost:9000 -e STORAGE_BUCKET=halqa-load -e STORAGE_REGION=us-east-1 \
            -e STORAGE_ACCESS_KEY_ID=loadtest -e STORAGE_SECRET_ACCESS_KEY=loadtest-secret \
            -e THROTTLE_AUTH=100000/min -e THROTTLE_UPLOAD=100000/hour -e THROTTLE_BOOKING=100000/min \
            halqa:load
          docker exec app python manage.py migrate --noinput -v0
          docker exec app python manage.py createcachetable
          for i in $(seq 1 30); do curl -fs localhost:8090/api/ready && break; sleep 2; done; echo

      - name: Synthetic dataset and verified Quran text
        run: |
          docker exec -e LOAD_TEST_DATASET=1 -e LOAD_TEST_PASSWORD="$LOAD_PASSWORD" app python manage.py seed_load | tee seed.txt
          curl -sSL -A "halqa-loadtest (+https://github.com/ahmedmotaleb/Quran-app)" -o quran.txt \
            "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=false&tatweel=true&quranType=uthmani&outType=txt-2&agree=true"
          curl -sSL -o meta.xml https://tanzil.net/res/text/metadata/quran-data.xml
          docker cp quran.txt app:/tmp/quran.txt && docker cp meta.xml app:/tmp/meta.xml
          docker exec app python manage.py import_quran /tmp/quran.txt --metadata /tmp/meta.xml --source-version loadtest --activate | tail -2
          curl -fs localhost:8090/api/ready; echo
          docker exec pg psql -U halqa -d halqa_load -c 'select pg_stat_statements_reset()' >/dev/null

      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz
          python3 -c "import os;open('loadtest/sample.webm','wb').write(b'\x1a\x45\xdf\xa3'+os.urandom(200*1024))"

      - name: Run the load profile (with resource sampling)
        run: |
          ( while true; do
              s=$(docker stats --no-stream --format '{{.CPUPerc}},{{.MemUsage}}' app | sed 's/ \/.*//')
              c=$(docker exec pg psql -U halqa -d halqa_load -tAc "select count(*) from pg_stat_activity where datname='halqa_load'")
              l=$(docker exec pg psql -U halqa -d halqa_load -tAc "select count(*) from pg_locks where not granted")
              echo "$(date +%s),$s,$c,$l"; sleep 5
            done > samples.csv ) &
          echo $! > sampler.pid
          RACE=$(grep -o 'race_occurrence=[0-9]*' seed.txt | cut -d= -f2)
          cd loadtest && ../k6-v0.54.0-linux-amd64/k6 run -q -e BASE=http://localhost:8090 -e PASSWORD="$LOAD_PASSWORD" \
            -e RACE_OCC="$RACE" -e HOLD="${{ inputs.hold }}" halqa.js || echo "K6_EXIT=$?" >> "$GITHUB_ENV"
          kill $(cat ../sampler.pid) || true

      - name: Report
        if: always()
        run: |
          {
            echo "## Load test result"
            echo "Environment: GitHub-hosted runner; app image from this commit with --cpus 1 --memory 512m (Cloud Run size), gunicorn 2 workers x 4 threads;"
            echo "PostgreSQL 16 on the same runner (not Neon); MinIO as S3 (not R2). Dataset: $(cat seed.txt)."
            echo
            cat loadtest/loadtest-summary.md 2>/dev/null || echo "k6 did not produce a summary"
            echo
            echo "### Resources (5-second samples)"
            python3 - <<'PY'
          import csv
          rows = [r for r in csv.reader(open("samples.csv")) if len(r) == 5]
          def mib(v):
              v = v.strip(); n = float(''.join(c for c in v if c.isdigit() or c == '.'))
              return n / 1024 if 'KiB' in v else n * 1024 if 'GiB' in v else n
          cpu = [float(r[1].rstrip('%')) for r in rows]; mem = [mib(r[2]) for r in rows]
          con = [int(r[3]) for r in rows]; lk = [int(r[4]) for r in rows]
          print(f"| samples | app CPU max / avg | app memory max | DB connections max | waiting locks max |\n| --- | --- | --- | --- | --- |")
          print(f"| {len(rows)} | {max(cpu):.0f}% / {sum(cpu)/len(cpu):.0f}% | {max(mem):.0f} MiB of 512 | {max(con)} | {max(lk)} |")
          PY
            echo
            echo "Container restarts: $(docker inspect -f '{{.RestartCount}}' app); OOM killed: $(docker inspect -f '{{.State.OOMKilled}}' app); running: $(docker inspect -f '{{.State.Running}}' app)"
            echo "Server errors logged: $(docker logs app 2>&1 | grep -c '"level": "ERROR"' || true)"
            echo
            echo "### Slowest queries (pg_stat_statements, by mean time)"
            echo '```'
            docker exec pg psql -U halqa -d halqa_load -c "select calls, round(mean_exec_time::numeric,1) mean_ms, round(max_exec_time::numeric,1) max_ms, left(regexp_replace(query, '\s+', ' ', 'g'), 110) query from pg_stat_statements where calls > 5 order by mean_exec_time desc limit 12"
            echo '```'
            echo "### Most total database time"
            echo '```'
            docker exec pg psql -U halqa -d halqa_load -c "select calls, round(total_exec_time::numeric) total_ms, round(mean_exec_time::numeric,2) mean_ms, left(regexp_replace(query, '\s+', ' ', 'g'), 110) query from pg_stat_statements order by total_exec_time desc limit 10"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > report.md
          echo "::notice title=Load test::$(head -c 600 loadtest/loadtest-summary.md 2>/dev/null | head -2 | tr '\n' ' ')"
          docker logs app > app.log 2>&1 || true
          test -z "${K6_EXIT:-}" || { echo "::error title=Load test::k6 thresholds failed (exit ${K6_EXIT})"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-${{ github.sha }}
          path: |
            report.md
            samples.csv
            seed.txt
            app.log
            loadtest/loadtest-summary.md
            loadtest/loadtest-summary.json
          retention-days: 30
