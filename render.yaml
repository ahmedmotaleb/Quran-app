# Render Blueprint — free plan. Deploy: Render dashboard → New → Blueprint → pick this repository.
# One web service serves both the PWA and the API (same origin, first-party cookies).
services:
  - type: web
    name: halqa
    runtime: docker
    plan: free
    region: frankfurt          # closest Render region to Cairo
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL       # Neon → Connection details → direct (non-pooled) string, with ?sslmode=require
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Optional until you have them — the app runs and says these features are not configured:
      - key: STORAGE_ENDPOINT_URL   # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_HOST             # e.g. a free SMTP plan
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
